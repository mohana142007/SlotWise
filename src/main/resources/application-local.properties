spring.application.name=slotwise-local
server.port=${PORT:8081}

spring.datasource.url=jdbc:h2:file:./data/slotwisedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

app.admin.email=admin@slotwise.edu
app.admin.password=Admin@1234
app.admin.name=System Administrator
