spring.application.name=slotwise
server.port=${PORT:8081}

# MongoDB Database Configuration
# Automatically connects to local MongoDB on port 27017, or custom MONGO_URI
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/slotwise_db}

# Initial Administrator account configuration
# Configurable via environment variables: ADMIN_EMAIL, ADMIN_PASSWORD
app.admin.email=${ADMIN_EMAIL:admin@slotwise.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
app.admin.name=System Administrator

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
