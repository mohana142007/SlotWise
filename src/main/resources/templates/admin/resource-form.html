<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit} ? 'Edit Resource' : 'Add Resource')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div style="margin-bottom: 1rem;">
        <a th:href="@{/admin/resources}" style="font-size: 0.9rem; font-weight: 600;">&larr; Back to Resource Management</a>
    </div>

    <div class="form-card" style="max-width: 650px;">
        <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;"
            th:text="${isEdit} ? 'Edit Resource #' + ${resourceDto.id} : 'Add New Resource'">Add Resource</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Provide complete resource specifications for room/equipment inventory
        </p>

        <form th:action="${isEdit} ? @{/admin/resources/{id}/edit(id=${resourceDto.id})} : @{/admin/resources/new}"
              th:object="${resourceDto}" method="post">

            <div class="form-group">
                <label for="name">Resource Name <span style="color: var(--danger);">*</span></label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Computer Lab 2, 4K Sony Projector" required>
                <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="type">Resource Type <span style="color: var(--danger);">*</span></label>
                    <select id="type" th:field="*{type}" class="form-control" required>
                        <option th:each="t : ${resourceTypes}" th:value="${t}" th:text="${t.displayName}"></option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>

                <div class="form-group">
                    <label for="capacity">Capacity (Optional for rooms)</label>
                    <input type="number" id="capacity" th:field="*{capacity}" class="form-control" min="1" placeholder="e.g. 50">
                    <div class="form-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location / Building <span style="color: var(--danger);">*</span></label>
                <input type="text" id="location" th:field="*{location}" class="form-control" placeholder="e.g. Block B, Ground Floor (Room 004)" required>
                <div class="form-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
            </div>

            <div class="form-group">
                <label for="description">Detailed Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" placeholder="Specifications, available hardware, projection capabilities..."></textarea>
                <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
                <input type="checkbox" id="active" th:field="*{active}" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="active" style="margin-bottom: 0; cursor: pointer;">Resource is Active &amp; Available for Student/Staff Bookings</label>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 2; padding: 0.75rem;">
                    <span th:text="${isEdit} ? 'Update Resource' : 'Save New Resource'">Save</span>
                </button>
                <a th:href="@{/admin/resources}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
